databases:
  - name: hrms-db
    databaseName: hrms_db
    user: hrms_user

services:
  - type: web
    name: hrms-backend
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: hrms-db
          property: connectionString
